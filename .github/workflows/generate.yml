name: Generate SDK release

on:
  workflow_dispatch:
    inputs:
      models_tag:
        description: Exact open-traffic-generator/models release tag (for example v1.61.0)
        required: true
        type: string
      openapiart_ref:
        description: OpenAPIArt branch or tag to resolve
        required: false
        default: rpclogger-builder
        type: string
      dry_run:
        description: Dry run - generate, test, and upload artifacts without committing, tagging, or releasing
        required: false
        default: true
        type: boolean
      skip_openapi_validation:
        description: Skip the final OpenAPI specification validation to allow a spec with validation errors to still be converted
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  generate:
    uses: ./.github/workflows/generate-sdk.yml
    with:
      models_tag: ${{ inputs.models_tag }}
      openapiart_ref: ${{ inputs.openapiart_ref }}
      dry_run: ${{ inputs.dry_run }}
      skip_openapi_validation: ${{ inputs.skip_openapi_validation }}
    secrets: inherit
